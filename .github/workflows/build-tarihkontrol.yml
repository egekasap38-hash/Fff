name: Tarih Kontrol APK
on:
  push:
    branches: ['tarihkontrol-apk-20261121']
    paths:
      - '.github/workflows/build-tarihkontrol.yml'
      - 'TarihKontrol_Modern_Proje.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract project
        run: unzip -q TarihKontrol_Modern_Proje.zip
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fix minimum Android version
        run: sed -i 's/minSdk 23/minSdk 24/' TarihKontrolAPK/app/build.gradle
      - name: Assemble
        working-directory: TarihKontrolAPK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TarihKontrol-v3-APK
          path: TarihKontrolAPK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        run: |
          cp TarihKontrolAPK/app/build/outputs/apk/debug/app-debug.apk TarihKontrol.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TarihKontrol.apk
          git commit -m 'Publish Tarih Kontrol v3 APK'
          git push origin HEAD:tarihkontrol-apk-20261121
