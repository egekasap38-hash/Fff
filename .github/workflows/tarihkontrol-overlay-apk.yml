name: Tarih Kontrol v5 Draggable Overlay APK
on:
  push:
    branches: [tarihkontrol-apk-20261121]
    paths:
      - 'TarihKontrol_v5_OverlayService.java.xz'
      - '.github/workflows/tarihkontrol-overlay-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract base project
        run: tar -xJf TarihKontrol_source.tar.xz
      - name: Apply v5 floating buttons and home-return flow
        run: |
          xz -dc TarihKontrol_v5_OverlayService.java.xz > TarihKontrolOverlay/app/src/main/java/com/ege/tarihkontrol/OverlayService.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("TarihKontrolOverlay/app/src/main/java/com/ege/tarihkontrol/MainActivity.java")
          s = p.read_text()
          assert "private Button overlayButton;" in s
          s = s.replace("    private Button overlayButton;", "    private Button overlayButton;\n    private Button resetButton;")
          assert 'overlayStatus = label("", 13, 0xFFA6B5CE, false);' in s
          s = s.replace('        overlayStatus = label("", 13, 0xFFA6B5CE, false);', '''        resetButton = actionButton("Buton konumlarını sıfırla", 0xFF25364F);
                  LinearLayout.LayoutParams rLp = new LinearLayout.LayoutParams(-1, dp(48));
                  rLp.topMargin = dp(12);
                  root.addView(resetButton, rLp);
                  resetButton.setOnClickListener(v -> resetPositions());
                  overlayStatus = label("", 13, 0xFFA6B5CE, false);''')
          s = s.replace('"Panel diğer uygulamaların üzerinde açık" : "Panel kapalı"', '"Sürükle: taşı  •  Dokun: işlemi uygula" : "Panel kapalı"')
          s = s.replace('    @Override protected void onResume()', '''    private void resetPositions() {
                  getSharedPreferences("floating_button_positions_v5", MODE_PRIVATE).edit().clear().apply();
                  if (OverlayService.running) {
                      Intent reset = new Intent(this, OverlayService.class);
                      reset.setAction(OverlayService.ACTION_RESET_POSITIONS);
                      startService(reset);
                  } else {
                      overlayStatus.setText("Konumlar sıfırlandı");
                  }
              }
              @Override protected void onResume()''')
          p.write_text(s)
          p = Path("TarihKontrolOverlay/app/build.gradle")
          s = p.read_text().replace("versionCode 4", "versionCode 5").replace("versionName '4.0-overlay'", "versionName '5.0-draggable'")
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile APK
        working-directory: TarihKontrolOverlay
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TarihKontrol-v5-Suruklenebilir-APK
          path: TarihKontrolOverlay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
