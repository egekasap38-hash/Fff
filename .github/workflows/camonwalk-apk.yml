name: CamonWalk APK Build v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/camonwalk-apk.yml'
      - 'CamonWalk_Android_Proje.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q CamonWalk_Android_Proje.zip

      - name: Apply DeFit-style v2 upgrade
        run: |
          python3 scripts/camonwalk_v2_upgrade.py
          python3 scripts/camonwalk_v3_diagnostics.py

      - name: Update Android build dependencies
        run: |
          sed -i 's/version "8.7.3"/version "8.9.2"/' CamonWalk/build.gradle.kts
          sed -i 's/compileSdk = 35/compileSdk = 36/' CamonWalk/app/build.gradle.kts
          sed -i '/<string-array name="health_permissions">/,/<\/string-array>/d' CamonWalk/app/src/main/res/values/strings.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install SDK platform
        run: |
          echo "y" | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Compile debug APK
        working-directory: CamonWalk
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamonWalk-APK
          path: CamonWalk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
